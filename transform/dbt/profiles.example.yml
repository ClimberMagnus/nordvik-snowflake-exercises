# Copy to ~/.dbt/profiles.yml and fill in. Key-pair auth, not passwords.
nordvik:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: DXHGGSH-CLIMBERAB_PARTNER
      user: <your Snowflake user name>
      private_key_path: ~/.ssh/snowflake_key.p8
      role: _SEC_CL_SNOWFLAKE_DEVELOPERS
      database: NORDVIK
      warehouse: NORDVIK_WH
      schema: DBT_<your initials>
      threads: 8
      client_session_keep_alive: false
